<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace Platform</title>
  <link rel="stylesheet" href="styles.css">
  <script src="workspaces.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Workspace Platform</h1>
      <p>Un espacio para organizar proyectos y recursos.</p>
    </header>

    <section aria-labelledby="workspaces-title">
      <h2 id="workspaces-title">Mis workspaces</h2>

      <form class="workspace-form" id="workspace-form">
        <label for="workspace-name">
          Nombre
          <input id="workspace-name" name="name" type="text" required autocomplete="off">
        </label>
        <button class="workspace-button" id="workspace-button" type="submit" disabled>Crear espacio</button>
      </form>
      <p id="workspace-message" role="status"></p>

      <p id="workspaces-status" role="status">Activa JavaScript para consultar tus espacios.</p>
      <div class="workspaces" id="workspaces"></div>

      <!-- Conservamos las páginas iniciales por id para que sus enlaces sigan funcionando al renombrarlas. -->
      <template id="workspace-1">
        <div class="workspace-card">
          <article>
            <a class="workspace-link" href="japan/index.html">
              <h3>Japan</h3>
              <p>Itinerarios, fotografías y documentos del viaje.</p>
              <span>Ver workspace <span aria-hidden="true">→</span></span>
            </a>
          </article>
        </div>
      </template>

      <template id="workspace-2">
        <div class="workspace-card">
          <article>
            <a class="workspace-link" href="recetas/index.html">
              <h3>Recetas</h3>
              <p>Platos favoritos e ideas para cocinar.</p>
              <span>Ver workspace <span aria-hidden="true">→</span></span>
            </a>
          </article>
        </div>
      </template>

      <template id="workspace-3">
        <div class="workspace-card">
          <article>
            <a class="workspace-link" href="personal-library/index.html">
              <h3>Personal Library</h3>
              <p>Libros y lecturas pendientes.</p>
              <span>Ver workspace <span aria-hidden="true">→</span></span>
            </a>
          </article>
        </div>
      </template>

      <template id="workspace-card">
        <div class="workspace-card">
          <article>
            <h3></h3>
            <p>Contenido pendiente.</p>
          </article>
        </div>
      </template>

      <!-- Una sola plantilla añade las mismas acciones a cada tarjeta. -->
      <template id="workspace-actions">
        <div class="workspace-actions">
          <div class="workspace-buttons">
            <button class="workspace-button rename-button" type="button">Renombrar</button>
            <button class="workspace-button delete-button" type="button">Eliminar</button>
          </div>
          <form class="workspace-form" hidden>
            <label>
              Nuevo nombre
              <input name="name" type="text" required autocomplete="off">
            </label>
            <button class="workspace-button" type="submit">Guardar</button>
            <button class="workspace-button cancel-button" type="button">Cancelar</button>
          </form>
          <p role="status"></p>
          <dialog class="workspace-delete-dialog" aria-label="Eliminar espacio">
            <p></p>
            <div class="workspace-buttons">
              <button class="workspace-button delete-button confirm-delete-button" type="button">Eliminar espacio</button>
              <button class="workspace-button cancel-delete-button" type="button" autofocus>Cancelar</button>
            </div>
          </dialog>
        </div>
      </template>
    </section>
  </main>
</body>
</html>
