services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      # Entre contenedores usamos el nombre del servicio de PostgreSQL.
      DATABASE_URL: postgresql://workspace@db:5432/workspace
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # --wait comprueba también que la API puede consultar PostgreSQL.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workspace
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "workspace", "-d", "workspace"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
